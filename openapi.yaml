    WebIntegration.Endpoints.Authentication.Requests.GenerateAccessTokenRequest:
      required:
        - clientId
        - clientSecret
      type: object
      properties:
        clientId:
          minLength: 1
          type: string
        clientSecret:
          minLength: 1
          type: string
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.AddressRequestContent:
      required:
        - logradouro
        - cidade
        - estado
        - bairro
        - cep
        - numero
      type: object
      properties:
        logradouro:
          minLength: 1
          type: string
          example: "Av. Paulista"
        cidade:
          minLength: 1
          type: string
          example: "São Paulo"
        estado:
          minLength: 2
          maxLength: 2
          type: string
          description: "Sigla da UF (ex.: SP, RJ, MG)."
          example: "SP"
        bairro:
          minLength: 1
          type: string
          example: "Bela Vista"
        cep:
          minLength: 1
          type: string
          description: CEP com 8 dígitos. Aceita com ou sem máscara (ex. `01311-000` ou `01311000`).
          example: "01311000"
        numero:
          minLength: 1
          type: string
          example: "1578"
        complemento:
          type: string
          nullable: true
          example: "Bloco B, Apto 1203"
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.ImportOrderInvoiceFromBase64Content:
      required:
        - pedidoId
        - arquivoBase64
        - nomeArquivo
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
          description: Identificador do pedido.
          example: "00000000-0000-0000-0000-000000000000"
        arquivoBase64:
          minLength: 1
          type: string
          description: Conteúdo do arquivo da nota fiscal codificado em base64.
          example: "JVBERi0xLjQKJeLjz9MKMSAwIG9iago..."
        nomeArquivo:
          minLength: 1
          type: string
          description: "Nome do arquivo com extensão (ex: nota-fiscal.pdf)."
          example: "nota-fiscal.pdf"
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.StartCDCSaleContest:
      required:
        - pedidoId
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.CreateOrderRequestContent:
      required:
        - celular
        - cpf
        - dataDeNascimento
        - documentoEstabelecimento
        - email
        - endereco
        - nome
        - valorSolicitado
      type: object
      properties:
        cpf:
          minLength: 1
          type: string
          description: CPF válido do cliente. Aceita com ou sem máscara (ex. `123.456.789-01` ou `12345678901`).
          example: "12345678901"
        celular:
          minLength: 1
          type: string
          description: Telefone celular do cliente, com código do país. Aceita com ou sem máscara (ex. `+55 (11) 91234-5678` ou `+5511912345678`).
          example: "+55 (11) 91234-5678"
        documentoEstabelecimento:
          minLength: 1
          type: string
          description: CNPJ válido do estabelecimento. Aceita com ou sem máscara (ex. `12.345.678/0001-95` ou `12345678000195`).
          example: "12345678000195"
        valorSolicitado:
          type: number
          format: double
          description: Valor bruto da venda.
          example: 1500.00
        nome:
          minLength: 1
          type: string
          example: "João da Silva"
        email:
          minLength: 1
          type: string
          example: "joao.silva@email.com"
        dataDeNascimento:
          type: string
          format: date-time
          example: "2023-11-07T05:31:56Z"
        endereco:
          $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.AddressRequestContent"
          description: |
            Define o valor de referência do pedido:
            - `1` — A partir do valor da venda. `valorSolicitado` representa o valor bruto da venda.
            - `2` — A partir do valor líquido. `valorSolicitado` representa o valor líquido que o estabelecimento deseja receber.

            Opcional. Quando omitido, o padrão é `1` (valor bruto).
          example: 1
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cabeçalho de autenticação Bearer no formato `Bearer <token>` onde `<token>` é seu TOKEN de autenticação
security:
  - bearerAuth: []
