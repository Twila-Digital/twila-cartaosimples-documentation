openapi: 3.0.1
info:
  title: WebIntegration
  description: Este documento descreve os endpoints disponíveis da API.
  version: "1.0"
servers:
  - url: https://api.staging.parcelemais.com.br/integration
    description: Servidor para o ambiente de staging
paths:
  /v1/order/start-cdc-sale:
    post:
      operationId: startCdcSale
      tags:
        - Pedido
      summary: Iniciar venda CDC.
      description: Inicia o processo de venda de um pedido CDC.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.StartCDCSaleContest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment.Shared.Responses.LinkPaymentResponse"
              example:
                linkPagamento: "https://pagamento.parcelemais.com.br/checkout/3c90c3cc-0d44-4b50-8888-8dd25736052a"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order:
    post:
      operationId: createOrder
      tags:
        - Pedido
      summary: Criar pedido.
      description: Cria um novo pedido CDC com os dados do cliente e as informações da venda.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.CreateOrderRequestContent"
            example:
              cpf: "12345678901"
              celular: "+55 (11) 91234-5678"
              documentoEstabelecimento: "12345678000195"
              valorSolicitado: 1500.00
              nome: "João da Silva"
              email: "joao.silva@email.com"
              dataDeNascimento: "1990-05-15T00:00:00Z"
              endereco:
                logradouro: "Av. Paulista"
                numero: "1578"
                complemento: "Bloco B, Apto 1203"
                bairro: "Bela Vista"
                cidade: "São Paulo"
                estado: "SP"
                cep: "01311000"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer.Shared.Responses.IdentifierResponse"
              example:
                pedidoId: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/invoice:
    post:
      operationId: importOrderInvoice
      tags:
        - Pedido
      summary: Importar nota fiscal.
      description: Importa a nota fiscal de um pedido CDC a partir de um arquivo em base64.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.ImportOrderInvoiceFromBase64Content"
            example:
              pedidoId: "00000000-0000-0000-0000-000000000000"
              arquivoBase64: "JVBERi0xLjQKJeLjz9MKMSAwIG9iago..."
              nomeArquivo: "nota-fiscal.pdf"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/authentication/accesstoken:
    post:
      operationId: generateAccessToken
      tags:
        - Autenticação
      summary: Gerar token de acesso.
      description: Gera um token de acesso (access_token) para o parceiro utilizando as credenciais do cliente (client_id e client_secret).
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Authentication.Requests.GenerateAccessTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.Services.Cognito.AccessTokenResult"
              example:
                token_de_acesso: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                expira_em_segundos: 3600
                expira_em: "2025-01-15T11:30:00-03:00"
                tipo_de_token: "Bearer"
                escopo: "parcelemais.integration.access/full"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/{pedidoId}:
    get:
      operationId: getOrder
      tags:
        - Pedido
      summary: Obter pedido.
      description: Retorna os detalhes de um pedido pelo identificador.
      parameters:
        - name: pedidoId
          in: path
          description: Identificador único do pedido.
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration.Shared.Responses.Order.OrderIntegrationResponse"
              example:
                id: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
                numero: 1001
                status:
                  valor: 2
                  descricao: "Aprovado"
                total: 1500.00
                nomeCliente: "João da Silva"
                documentoCliente: "12345678901"
                prazo: 12
                razaoSocialEstabelecimento: "Loja Exemplo LTDA"
                documentoEstabelecimento: "12345678000195"
                descricao: "Compra de eletrônicos"
                valorAprovado: 1500.00
                desembolsado: true
                criadoEm: "2025-01-15T10:30:00-03:00"
                desembolsadoEm: "2025-01-16T09:00:00-03:00"
                valorSolicitado: 1500.00
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/list:
    get:
      operationId: listOrders
      tags:
        - Pedido
      summary: Listar pedidos.
      description: Retorna todos os pedidos do parceiro com filtros opcionais.
      parameters:
        - name: status
          in: query
          description: |
            Filtrar por status do pedido. Campo opcional.

            Valores possíveis:
            - 0 - Indefinido
            - 1 - Em análise
            - 2 - Aprovado
            - 3 - Saldo indisponível
            - 4 - Análise expirada
            - 5 - Pagamento pendente
            - 6 - Biometria recusada
            - 7 - Biometria aprovada
            - 8 - Pagamento recusado
            - 9 - Comprado
            - 10 - Não autorizado
            - 11 - Autorização pendente
            - 12 - Aguardando cadastro
            - 13 - Venda não iniciada
            - 14 - Cancelado
            - 15 - Faturamento
            - 16 - Concluído
            - 17 - Congelado
            - 18 - Confirmação de pagamento pendente
          schema:
            type: integer
            format: int32
        - name: documentoCliente
          in: query
          description: CPF do cliente (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
        - name: dataInicio
          in: query
          description: Data de início do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00-03:00"
          example: "2025-01-01T00:00:00-03:00"
        - name: dataFim
          in: query
          description: Data de fim do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-12-31T23:59:59-03:00"
          example: "2025-12-31T23:59:59-03:00"
        - name: numero
          in: query
          description: Número do pedido. Campo opcional.
          schema:
            type: integer
            format: int64
            example: 1001
          example: 1001
        - name: documentoLoja
          in: query
          description: CNPJ do estabelecimento (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678000195"
          example: "12345678000195"
        - name: descricao
          in: query
          description: Filtrar por descrição do pedido. Campo opcional.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration.Shared.Responses.Order.OrderIntegrationResponse"
              example:
                - id: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
                  numero: 1001
                  status:
                    valor: 2
                    descricao: "Aprovado"
                  total: 1500.00
                  nomeCliente: "João da Silva"
                  documentoCliente: "12345678901"
                  prazo: 12
                  razaoSocialEstabelecimento: "Loja Exemplo LTDA"
                  documentoEstabelecimento: "12345678000195"
                  descricao: "Compra de eletrônicos"
                  valorAprovado: 1500.00
                  desembolsado: true
                  criadoEm: "2025-01-15T10:30:00-03:00"
                  desembolsadoEm: "2025-01-16T09:00:00-03:00"
                  valorSolicitado: 1500.00
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/paged:
    get:
      operationId: pagedOrders
      tags:
        - Pedido
      summary: Listar pedidos paginados.
      description: Retorna uma lista paginada de pedidos do parceiro com filtros opcionais.
      parameters:
        - name: status
          in: query
          description: |
            Filtrar por status do pedido. Campo opcional.

            Valores possíveis:
            - 0 - Indefinido
            - 1 - Em análise
            - 2 - Aprovado
            - 3 - Saldo indisponível
            - 4 - Análise expirada
            - 5 - Pagamento pendente
            - 6 - Biometria recusada
            - 7 - Biometria aprovada
            - 8 - Pagamento recusado
            - 9 - Comprado
            - 10 - Não autorizado
            - 11 - Autorização pendente
            - 12 - Aguardando cadastro
            - 13 - Venda não iniciada
            - 14 - Cancelado
            - 15 - Faturamento
            - 16 - Concluído
            - 17 - Congelado
            - 18 - Confirmação de pagamento pendente
          schema:
            type: integer
            format: int32
        - name: documentoCliente
          in: query
          description: CPF do cliente (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
        - name: dataInicio
          in: query
          description: Data de início do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00-03:00"
          example: "2025-01-01T00:00:00-03:00"
        - name: dataFim
          in: query
          description: Data de fim do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-12-31T23:59:59-03:00"
          example: "2025-12-31T23:59:59-03:00"
        - name: numero
          in: query
          description: Número do pedido. Campo opcional.
          schema:
            type: integer
            format: int64
            example: 1001
          example: 1001
        - name: documentoLoja
          in: query
          description: CNPJ do estabelecimento (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678000195"
          example: "12345678000195"
        - name: descricao
          in: query
          description: Filtrar por descrição do pedido. Campo opcional.
          schema:
            type: string
        - name: pagina
          in: query
          description: "Número da página. Padrão: 1."
          schema:
            type: integer
            format: int32
            example: 1
          example: 1
        - name: tamanhoPagina
          in: query
          description: "Quantidade de itens por página. Padrão: 10."
          schema:
            type: integer
            format: int32
            example: 10
          example: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Core.Domain.Primitives.IPagedResult_OrderIntegrationResponse"
              example:
                items:
                  - id: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
                    numero: 1001
                    status:
                      valor: 2
                      descricao: "Aprovado"
                    total: 1500.00
                    nomeCliente: "João da Silva"
                    documentoCliente: "12345678901"
                    prazo: 12
                    razaoSocialEstabelecimento: "Loja Exemplo LTDA"
                    documentoEstabelecimento: "12345678000195"
                    descricao: "Compra de eletrônicos"
                    valorAprovado: 1500.00
                    desembolsado: true
                    criadoEm: "2025-01-15T10:30:00-03:00"
                    desembolsadoEm: "2025-01-16T09:00:00-03:00"
                    valorSolicitado: 1500.00
                page:
                  temProxima: true
                  temAnterior: false
                  numero: 1
                  tamanho: 10
                  total: 42
                  numeroPaginaMaximo: 5
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/customer/{clienteId}:
    get:
      operationId: getCustomer
      tags:
        - Cliente
      summary: Obter cliente.
      description: Retorna os detalhes de um cliente pelo identificador.
      parameters:
        - name: clienteId
          in: path
          description: Identificador único do cliente.
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration.Shared.Responses.Customer.CustomerIntegrationResponse"
              example:
                id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                nome: "Maria Souza"
                documento: "98765432100"
                endereco:
                  rua: "Av. Paulista"
                  cidade: "São Paulo"
                  estado: "SP"
                  bairro: "Bela Vista"
                  cep: "01310-100"
                  pais: "BR"
                  numero: "1578"
                  complemento: "Apto 42"
                dataDeNascimento: "1990-03-22T00:00:00Z"
                email: "maria.souza@email.com"
                celular: "+55 (11) 91234-5678"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/customer/list:
    get:
      operationId: listCustomers
      tags:
        - Cliente
      summary: Listar clientes.
      description: Retorna todos os clientes vinculados ao parceiro com filtros opcionais.
      parameters:
        - name: nome
          in: query
          description: Filtrar por nome do cliente. Campo opcional.
          schema:
            type: string
            example: "Maria Souza"
          example: "Maria Souza"
        - name: documento
          in: query
          description: Filtrar por CPF do cliente (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration.Shared.Responses.Customer.CustomerIntegrationResponse"
              example:
                - id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                  nome: "Maria Souza"
                  documento: "98765432100"
                  endereco:
                    rua: "Av. Paulista"
                    cidade: "São Paulo"
                    estado: "SP"
                    bairro: "Bela Vista"
                    cep: "01310-100"
                    pais: "BR"
                    numero: "1578"
                    complemento: "Apto 42"
                  dataDeNascimento: "1990-03-22T00:00:00Z"
                  email: "maria.souza@email.com"
                  celular: "+55 (11) 91234-5678"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/customer/paged:
    get:
      operationId: pagedCustomers
      tags:
        - Cliente
      summary: Listar clientes paginados.
      description: Retorna uma lista paginada de clientes vinculados ao parceiro com filtros opcionais.
      parameters:
        - name: nome
          in: query
          description: Filtrar por nome do cliente. Campo opcional.
          schema:
            type: string
            example: "Maria Souza"
          example: "Maria Souza"
        - name: documento
          in: query
          description: Filtrar por CPF do cliente (somente números). Campo opcional.
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
        - name: pagina
          in: query
          description: "Número da página. Padrão: 1."
          schema:
            type: integer
            format: int32
            example: 1
          example: 1
        - name: tamanhoPagina
          in: query
          description: "Quantidade de itens por página. Padrão: 10."
          schema:
            type: integer
            format: int32
            example: 10
          example: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Core.Domain.Primitives.IPagedResult_CustomerIntegrationResponse"
              example:
                items:
                  - id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                    nome: "Maria Souza"
                    documento: "98765432100"
                    endereco:
                      rua: "Av. Paulista"
                      cidade: "São Paulo"
                      estado: "SP"
                      bairro: "Bela Vista"
                      cep: "01310-100"
                      pais: "BR"
                      numero: "1578"
                      complemento: "Apto 42"
                    dataDeNascimento: "1990-03-22T00:00:00Z"
                    email: "maria.souza@email.com"
                    celular: "+55 (11) 91234-5678"
                page:
                  temProxima: true
                  temAnterior: false
                  numero: 1
                  tamanho: 10
                  total: 15
                  numeroPaginaMaximo: 2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
components:
  schemas:
    Common.Services.Cognito.AccessTokenResult:
      type: object
      properties:
        token_de_acesso:
          type: string
        expira_em_segundos:
          type: integer
          format: int32
        expira_em:
          type: string
          format: date-time
          readOnly: true
        tipo_de_token:
          type: string
        escopo:
          type: string
      additionalProperties: false
    Core.Domain.Primitives.IPagedResult_CustomerIntegrationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration.Shared.Responses.Customer.CustomerIntegrationResponse"
          readOnly: true
        page:
          $ref: "#/components/schemas/Core.Domain.Primitives.Page"
      additionalProperties: false
    Core.Domain.Primitives.IPagedResult_OrderIntegrationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration.Shared.Responses.Order.OrderIntegrationResponse"
          readOnly: true
        page:
          $ref: "#/components/schemas/Core.Domain.Primitives.Page"
      additionalProperties: false
    Core.Domain.Primitives.Page:
      type: object
      properties:
        temProxima:
          type: boolean
        temAnterior:
          type: boolean
        numero:
          type: integer
          format: int32
        tamanho:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        numeroPaginaMaximo:
          type: integer
          format: int32
      additionalProperties: false
    Customer.Shared.Responses.IdentifierResponse:
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
      additionalProperties: false
    Integration.Shared.Responses.Customer.Address:
      type: object
      properties:
        rua:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        complemento:
          type: string
          nullable: true
      additionalProperties: false
    Integration.Shared.Responses.Customer.CustomerIntegrationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        documento:
          type: string
        endereco:
          $ref: "#/components/schemas/Integration.Shared.Responses.Customer.Address"
        dataDeNascimento:
          type: string
          format: date-time
        email:
          type: string
          nullable: true
        celular:
          type: string
          nullable: true
      additionalProperties: false
    Integration.Shared.Responses.Order.OrderStatus:
      type: object
      description: |
        Status do pedido. Consulte a legenda completa em [Webhooks → Legenda do EnumStatus](/webhooks).
      properties:
        valor:
          type: integer
          format: int32
        descricao:
          type: string
      additionalProperties: false
    Integration.Shared.Responses.Order.OrderIntegrationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/Integration.Shared.Responses.Order.OrderStatus"
        total:
          type: number
          format: double
          nullable: true
        nomeCliente:
          type: string
          nullable: true
        documentoCliente:
          type: string
        prazo:
          type: integer
          format: int32
          nullable: true
        razaoSocialEstabelecimento:
          type: string
        documentoEstabelecimento:
          type: string
        descricao:
          type: string
          nullable: true
        valorAprovado:
          type: number
          format: double
          nullable: true
        desembolsado:
          type: boolean
          nullable: true
        criadoEm:
          type: string
          format: date-time
        desembolsadoEm:
          type: string
          format: date-time
          nullable: true
        valorSolicitado:
          type: number
          format: double
          nullable: true
      additionalProperties: false
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        tipo:
          type: string
          nullable: true
        titulo:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detalhe:
          type: string
          nullable: true
        instancia:
          type: string
          nullable: true
      example:
        tipo: "https://tools.ietf.org/html/rfc7231#section-6.5.1"
        titulo: "Requisição inválida."
        status: 400
        detalhe: "O campo 'cpf' é obrigatório."
        instancia: "/v1/order"
    Payment.Shared.Responses.LinkPaymentResponse:
      type: object
      properties:
        linkPagamento:
          type: string
          nullable: true
      additionalProperties: false
    WebIntegration.Endpoints.Authentication.Requests.GenerateAccessTokenRequest:
      required:
        - clientId
        - clientSecret
      type: object
      properties:
        clientId:
          minLength: 1
          type: string
        clientSecret:
          minLength: 1
          type: string
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.AddressRequestContent:
      type: object
      properties:
        logradouro:
          type: string
          nullable: true
          example: "Av. Paulista"
        cidade:
          type: string
          nullable: true
          example: "São Paulo"
        estado:
          type: string
          nullable: true
          example: "SP"
          maxLength: 2
        bairro:
          type: string
          nullable: true
          example: "Bela Vista"
        cep:
          type: string
          nullable: true
          example: "01311000"
        numero:
          type: string
          nullable: true
          example: "1578"
        complemento:
          type: string
          nullable: true
          example: "Bloco B, Apto 1203"
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.ImportOrderInvoiceFromBase64Content:
      required:
        - pedidoId
        - arquivoBase64
        - nomeArquivo
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
          description: Identificador do pedido.
          example: "00000000-0000-0000-0000-000000000000"
        arquivoBase64:
          minLength: 1
          type: string
          description: Conteúdo do arquivo da nota fiscal codificado em base64.
          example: "JVBERi0xLjQKJeLjz9MKMSAwIG9iago..."
        nomeArquivo:
          minLength: 1
          type: string
          description: "Nome do arquivo com extensão (ex: nota-fiscal.pdf)."
          example: "nota-fiscal.pdf"
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.StartCDCSaleContest:
      required:
        - pedidoId
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
      additionalProperties: false
    WebIntegration.Endpoints.Order.Requests.CreateOrderRequestContent:
      required:
        - celular
        - cpf
        - dataDeNascimento
        - documentoEstabelecimento
        - email
        - nome
        - valorSolicitado
      type: object
      properties:
        cpf:
          minLength: 1
          type: string
          example: "12345678901"
        celular:
          minLength: 1
          type: string
          example: "+55 (11) 91234-5678"
        documentoEstabelecimento:
          minLength: 1
          type: string
          example: "12345678000195"
        valorSolicitado:
          type: number
          format: double
          example: 1500.00
        nome:
          minLength: 1
          type: string
          example: "João da Silva"
        email:
          minLength: 1
          type: string
          example: "joao.silva@email.com"
        dataDeNascimento:
          type: string
          format: date-time
          example: "2023-11-07T05:31:56Z"
        endereco:
          $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.AddressRequestContent"
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cabeçalho de autenticação Bearer no formato `Bearer <token>` onde `<token>` é seu TOKEN de autenticação
security:
  - bearerAuth: []
