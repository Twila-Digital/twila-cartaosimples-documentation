openapi: 3.0.1
info:
  title: WebIntegration
  description: Este documento descreve os endpoints disponíveis da API.
  version: "1.0"
servers:
  - url: https://api.staging.parcelemais.com.br/integration
    description: Servidor para o ambiente de staging
paths:
  /v1/order/simulate-installments:
    get:
      operationId: listSimulateInstallments
      tags:
        - Pedido
      summary: Simular parcelas.
      description: Retorna as opções de parcelamento disponíveis para o valor informado. O parceiro e a rede de lojas são identificados automaticamente pelo token de acesso.
      parameters:
        - name: valorSolicitado
          in: query
          description: Valor de referência para a simulação. Deve ser igual ou superior a R$ 250,00. O significado depende de `tipoValorCalculo`.
          required: true
          schema:
            type: number
            format: double
            minimum: 250
          example: 1500.00
        - name: tipoValorCalculo
          in: query
          description: |
            Define o valor de referência do cálculo:
            - `1` — A partir do valor da venda. `valorSolicitado` representa o valor bruto da venda.
            - `2` — A partir do valor líquido. `valorSolicitado` representa o valor líquido que o estabelecimento deseja receber.

            Opcional. Quando omitido, o padrão é `1` (valor bruto).
          required: false
          schema:
            type: integer
            format: int32
            enum: [1, 2]
            default: 1
          example: 1
      responses:
        "200":
          description: Opções de parcelamento calculadas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration.Shared.Responses.Order.ListSimulateInstallmentsSimplifiedIntegrationResponse"
              example:
                - valorTotalDebito: 1632.48
                  prazo: 12
                  valorParcela: 136.04
        "400":
          description: Parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Parceiro, estabelecimento ou rede de lojas não encontrado.
        "500":
          description: Internal Server Error
  /v1/order/simulate-values:
    get:
      operationId: getSimulationValues
      tags:
        - Pedido
      summary: Simular repasse.
      description: Calcula os valores da venda para o estabelecimento e para o cliente. O parceiro e a rede de lojas são identificados automaticamente pelo token de acesso.
      parameters:
        - name: valor
          in: query
          description: Valor de referência da simulação. O significado depende de `tipoValorCalculo`.
          required: true
          schema:
            type: number
            format: double
          example: 1500.00
        - name: prazo
          in: query
          description: |
            Quantidade de parcelas da simulação. Deve estar dentro do intervalo de prazos configurado para a rede de lojas do parceiro.
            Fora desse intervalo, a API retorna `400` com o erro `Order.TermOutOfRange`.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 12
        - name: modeloJuros
          in: query
          description: |
            Define quem paga os juros. Por enquanto, use apenas `1`.
            - `1` — Cliente (disponível).
            - `2` — Estabelecimento (em breve; ainda não disponível).
          required: true
          schema:
            type: integer
            format: int32
            enum: [1]
          example: 1
        - name: tipoValorCalculo
          in: query
          description: |
            Define o valor de referência do cálculo:
            - `1` — A partir do valor da venda. `valor` representa o valor bruto da venda.
            - `2` — A partir do valor líquido. `valor` representa o valor líquido que o estabelecimento deseja receber.
          required: true
          schema:
            type: integer
            format: int32
            enum: [1, 2]
          example: 1
      responses:
        "200":
          description: Valores calculados com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration.Shared.Responses.Order.SimulationValuesIntegrationResponse"
              example:
                valoresEstabelecimento:
                  valorVenda: 7054.673721340388
                  valorDesembolso: 5959.26
                valoresCliente:
                  valorParcela: 718.46
        "400":
          description: Parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Parceiro, estabelecimento ou rede de lojas não encontrado.
        "500":
          description: Internal Server Error
  /v1/order/start-cdc-sale:
    post:
      operationId: startCdcSale
      tags:
        - Pedido
      summary: Iniciar venda CDC.
      description: Inicia o processo de venda de um pedido CDC.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.StartCDCSaleContest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment.Shared.Responses.LinkPaymentResponse"
              example:
                linkPagamento: "https://pagamento.parcelemais.com.br/checkout/3c90c3cc-0d44-4b50-8888-8dd25736052a"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order:
    post:
      operationId: createOrder
      tags:
        - Pedido
      summary: Criar pedido.
      description: Cria um novo pedido CDC com os dados do cliente e as informações da venda.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.CreateOrderRequestContent"
            example:
              cpf: "12345678901"
              celular: "+55 (11) 91234-5678"
              documentoEstabelecimento: "12345678000195"
              valorSolicitado: 1500.00
              nome: "João da Silva"
              email: "joao.silva@email.com"
              dataDeNascimento: "1990-05-15T00:00:00Z"
              endereco:
                logradouro: "Av. Paulista"
                numero: "1578"
                complemento: "Bloco B, Apto 1203"
                bairro: "Bela Vista"
                cidade: "São Paulo"
                estado: "SP"
                cep: "01311000"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer.Shared.Responses.IdentifierResponse"
              example:
                pedidoId: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/invoice:
    post:
      operationId: importOrderInvoice
      tags:
        - Pedido
      summary: Importar nota fiscal.
      description: Importa a nota fiscal de um pedido CDC a partir de um arquivo em base64.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Order.Requests.ImportOrderInvoiceFromBase64Content"
            example:
              pedidoId: "00000000-0000-0000-0000-000000000000"
              arquivoBase64: "JVBERi0xLjQKJeLjz9MKMSAwIG9iago..."
              nomeArquivo: "nota-fiscal.pdf"
      responses:
        "204":
          description: Nota fiscal importada com sucesso.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/authentication/accesstoken:
    post:
      operationId: generateAccessToken
      tags:
        - Autenticação
      summary: Gerar token de acesso.
      description: Gera um token de acesso (access_token) para o parceiro utilizando as credenciais do cliente (client_id e client_secret).
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebIntegration.Endpoints.Authentication.Requests.GenerateAccessTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.Services.Cognito.AccessTokenResult"
              example:
                token_de_acesso: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                expira_em_segundos: 3600
                expira_em: "2025-01-15T11:30:00-03:00"
                tipo_de_token: "Bearer"
                escopo: "parcelemais.integration.access/full"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/{pedidoId}:
    get:
      operationId: getOrder
      tags:
        - Pedido
      summary: Obter pedido.
      description: Retorna os detalhes de um pedido pelo identificador.
      parameters:
        - name: pedidoId
          in: path
          description: Identificador único do pedido.
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration.Shared.Responses.Order.OrderIntegrationResponse"
              example:
                id: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
                numero: 1001
                status:
                  valor: 2
                  descricao: "Aprovado"
                total: 1500.00
                nomeCliente: "João da Silva"
                documentoCliente: "12345678901"
                prazo: 12
                razaoSocialEstabelecimento: "Loja Exemplo LTDA"
                documentoEstabelecimento: "12345678000195"
                descricao: "Compra de eletrônicos"
                valorAprovado: 1500.00
                desembolsado: true
                criadoEm: "2025-01-15T10:30:00-03:00"
                desembolsadoEm: "2025-01-16T09:00:00-03:00"
                valorSolicitado: 1500.00
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/order/paged:
    get:
      operationId: pagedOrders
      tags:
        - Pedido
      summary: Listar pedidos.
      description: Retorna uma lista paginada de pedidos do parceiro com filtros opcionais.
      parameters:
        - name: status
          in: query
          description: |
            Filtrar por status do pedido. Campo opcional.

            Valores possíveis:
            - 0 - Indefinido
            - 1 - Em análise
            - 2 - Aprovado
            - 3 - Saldo indisponível
            - 4 - Análise expirada
            - 5 - Pagamento pendente
            - 6 - Biometria recusada
            - 7 - Biometria aprovada
            - 8 - Pagamento recusado
            - 9 - Comprado
            - 10 - Não autorizado
            - 11 - Autorização pendente
            - 12 - Aguardando cadastro
            - 13 - Venda não iniciada
            - 14 - Cancelado
            - 15 - Faturamento
            - 16 - Concluído
            - 17 - Congelado
            - 18 - Confirmação de pagamento pendente
          schema:
            type: integer
            format: int32
        - name: documentoCliente
          in: query
          description: CPF do cliente. Campo opcional. Aceita com ou sem máscara (ex. `123.456.789-01` ou `12345678901`).
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
        - name: dataInicio
          in: query
          description: Data de início do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00-03:00"
          example: "2025-01-01T00:00:00-03:00"
        - name: dataFim
          in: query
          description: Data de fim do filtro no formato ISO-8601. Campo opcional.
          schema:
            type: string
            format: date-time
            example: "2025-12-31T23:59:59-03:00"
          example: "2025-12-31T23:59:59-03:00"
        - name: numero
          in: query
          description: Número do pedido. Campo opcional.
          schema:
            type: integer
            format: int64
            example: 1001
          example: 1001
        - name: documentoLoja
          in: query
          description: CNPJ do estabelecimento. Campo opcional. Aceita com ou sem máscara (ex. `12.345.678/0001-95` ou `12345678000195`).
          schema:
            type: string
            example: "12345678000195"
          example: "12345678000195"
        - name: descricao
          in: query
          description: Filtrar por descrição do pedido. Campo opcional.
          schema:
            type: string
        - name: pagina
          in: query
          description: "Número da página. Padrão: 1."
          schema:
            type: integer
            format: int32
            example: 1
          example: 1
        - name: tamanhoPagina
          in: query
          description: "Quantidade de itens por página. Padrão: 10."
          schema:
            type: integer
            format: int32
            example: 10
          example: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Core.Domain.Primitives.IPagedResult_OrderIntegrationResponse"
              example:
                items:
                  - id: "3c90c3cc-0d44-4b50-8888-8dd25736052a"
                    numero: 1001
                    status:
                      valor: 2
                      descricao: "Aprovado"
                    total: 1500.00
                    nomeCliente: "João da Silva"
                    documentoCliente: "12345678901"
                    prazo: 12
                    razaoSocialEstabelecimento: "Loja Exemplo LTDA"
                    documentoEstabelecimento: "12345678000195"
                    descricao: "Compra de eletrônicos"
                    valorAprovado: 1500.00
                    desembolsado: true
                    criadoEm: "2025-01-15T10:30:00-03:00"
                    desembolsadoEm: "2025-01-16T09:00:00-03:00"
                    valorSolicitado: 1500.00
                pagina:
                  tem_proximo: true
                  tem_anterior: false
                  numero: 2
                  tamanho: 15
                  total: 45
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/customer/{clienteId}:
    get:
      operationId: getCustomer
      tags:
        - Cliente
      summary: Obter cliente.
      description: Retorna os detalhes de um cliente pelo identificador.
      parameters:
        - name: clienteId
          in: path
          description: Identificador único do cliente.
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration.Shared.Responses.Customer.CustomerIntegrationResponse"
              example:
                id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                nome: "Maria Souza"
                documento: "98765432100"
                endereco:
                  rua: "Av. Paulista"
                  cidade: "São Paulo"
                  estado: "SP"
                  bairro: "Bela Vista"
                  cep: "01310-100"
                  pais: "BR"
                  numero: "1578"
                  complemento: "Apto 42"
                dataDeNascimento: "1990-03-22T00:00:00Z"
                email: "maria.souza@email.com"
                celular: "+55 (11) 91234-5678"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/customer/paged:
    get:
      operationId: pagedCustomers
      tags:
        - Cliente
      summary: Listar clientes.
      description: Retorna uma lista paginada de clientes vinculados ao parceiro com filtros opcionais.
      parameters:
        - name: nome
          in: query
          description: Filtrar por nome do cliente. Campo opcional.
          schema:
            type: string
            example: "Maria Souza"
          example: "Maria Souza"
        - name: documento
          in: query
          description: Filtrar por CPF do cliente. Campo opcional. Aceita com ou sem máscara (ex. `123.456.789-01` ou `12345678901`).
          schema:
            type: string
            example: "12345678901"
          example: "12345678901"
        - name: pagina
          in: query
          description: "Número da página. Padrão: 1."
          schema:
            type: integer
            format: int32
            example: 1
          example: 1
        - name: tamanhoPagina
          in: query
          description: "Quantidade de itens por página. Padrão: 10."
          schema:
            type: integer
            format: int32
            example: 10
          example: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Core.Domain.Primitives.IPagedResult_CustomerIntegrationResponse"
              example:
                items:
                  - id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                    nome: "Maria Souza"
                    documento: "98765432100"
                    endereco:
                      rua: "Av. Paulista"
                      cidade: "São Paulo"
                      estado: "SP"
                      bairro: "Bela Vista"
                      cep: "01310-100"
                      pais: "BR"
                      numero: "1578"
                      complemento: "Apto 42"
                    dataDeNascimento: "1990-03-22T00:00:00Z"
                    email: "maria.souza@email.com"
                    celular: "+55 (11) 91234-5678"
                pagina:
                  tem_proximo: true
                  tem_anterior: false
                  numero: 2
                  tamanho: 15
                  total: 45
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "500":
          description: Internal Server Error
  /v1/webhooks:
    post:
      operationId: createWebHook
      tags:
        - Webhook
      summary: Criar webhook.
      description: Cadastra um webhook para o parceiro identificado automaticamente pelo token de acesso. Cliente e Simulação podem ser configurados, mas seus fluxos de envio ainda estão em roadmap. Atualmente, os disparos estão disponíveis para Pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebHookRequest"
            example:
              tipo: 3
              url: "https://parceiro.exemplo.com/webhooks/pedidos"
              tipoAutenticacao: 3
              credencial: "seu-token-jwt"
      responses:
        "200":
          description: Webhook criado com sucesso.
        "400":
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails"
        "404":
          description: Parceiro não encontrado.
        "409":
          description: Já existe um webhook cadastrado para o tipo informado.
        "500":
          description: Internal Server Error
  /v1/webhooks/paged:
    get:
      operationId: pagedWebHooks
      tags:
        - Webhook
      summary: Listar webhooks.
      description: Retorna os webhooks cadastrados pelo parceiro. As credenciais de autenticação nunca são retornadas. Configurações de Cliente e Simulação podem aparecer na lista, embora esses fluxos ainda não realizem disparos.
      parameters:
        - name: pagina
          in: query
          description: "Número da página. Padrão: 1."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamanhoPagina
          in: query
          description: "Quantidade de itens por página. Padrão: 10. Máximo: 100."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Webhooks retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedWebHookIntegrationResponse"
              example:
                items:
                  - tipo: 3
                    url: "https://parceiro.exemplo.com/webhooks/pedidos"
                    tipoAutenticacao: 3
                pagina:
                  tem_proximo: false
                  tem_anterior: false
                  numero: 1
                  tamanho: 10
                  total: 1
        "400":
          description: Parâmetros de paginação inválidos.
        "404":
          description: Parceiro não encontrado.
        "500":
          description: Internal Server Error
  /v1/webhooks/{tipo}:
    put:
      operationId: updateWebHook
      tags:
        - Webhook
      summary: Editar webhook.
      description: Atualiza o webhook do tipo informado. Se a credencial for omitida, a credencial atual será preservada. Cliente e Simulação podem ser configurados, mas seus fluxos de envio ainda estão em roadmap.
      parameters:
        - $ref: "#/components/parameters/WebHookType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebHookRequest"
            example:
              url: "https://parceiro.exemplo.com/webhooks/pedidos"
              tipoAutenticacao: 2
              credencial: "usuario:senha"
      responses:
        "200":
          description: Webhook atualizado com sucesso.
        "400":
          description: Dados inválidos.
        "404":
          description: Parceiro ou webhook não encontrado.
        "500":
          description: Internal Server Error
    delete:
      operationId: deleteWebHook
      tags:
        - Webhook
      summary: Excluir webhook.
      description: Exclui o webhook do tipo informado para o parceiro identificado pelo token.
      parameters:
        - $ref: "#/components/parameters/WebHookType"
      responses:
        "200":
          description: Webhook excluído com sucesso.
        "400":
          description: Tipo de webhook inválido.
        "404":
          description: Parceiro ou webhook não encontrado.
        "500":
          description: Internal Server Error
components:
  parameters:
    WebHookType:
      name: tipo
      in: path
      required: true
      description: |
        Tipo do webhook:
        - `1` — Cliente: configuração disponível; fluxo de envio em roadmap.
        - `2` — Simulação: configuração disponível; fluxo de envio em roadmap.
        - `3` — Pedido: envio disponível para os eventos suportados.
      schema:
        type: integer
        format: int32
        enum: [1, 2, 3]
  schemas:
    CreateWebHookRequest:
      required: [tipo, url, tipoAutenticacao]
      type: object
      properties:
        tipo:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: "1: Cliente (fluxo em roadmap); 2: Simulação (fluxo em roadmap); 3: Pedido (envio disponível)."
        url:
          type: string
          format: uri
          description: URL HTTP ou HTTPS que receberá as notificações.
        tipoAutenticacao:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: "1: Nenhuma; 2: Basic; 3: JWT."
        credencial:
          type: string
          nullable: true
